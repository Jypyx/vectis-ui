<!--
  Material Symbols Rounded font, for the VIcon and VButton stories.
  In production it is the CONSUMER who loads this font (see the @vectis/ui
  README): it is not bundled in the package. Here it only serves the icon names
  used by the STORIES (`favorite`, `edit`…), never the icons the DS renders,
  which come from the built-in registry.
  display=block avoids the flash of the icon name spelled out in full.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
/>

<!--
  THIRD-PARTY icon fonts, only for VIcon's "Icon fonts" stories: they demonstrate
  `setIconResolver` against real libraries rather than mock-ups. None is a
  dependency of the package — neither npm nor runtime: they are CDN stylesheets
  loaded by this preview page.

  All three are CLASS-based fonts (glyph in `::before`), so they are served by
  `classIconResolver`. Their base selectors are compatible with the
  `<span class="v-icon-glyph …">` that VIcon renders:
    - Phosphor  : `.ph { font-family }` + `.ph.ph-x:before { content }`
    - FA 6      : `.fa-solid:before { content: var(--fa) }` + `.fa-xmark { --fa }`
    - Bootstrap : `.bi::before { font-family }` + `.bi-x-lg::before { content }`
-->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
/>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
/>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css"
/>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
/>
