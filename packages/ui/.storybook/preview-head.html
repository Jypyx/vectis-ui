<!--
  Police Material Symbols Rounded pour les stories d'Icon et Button.
  En production, c'est le CONSOMMATEUR qui charge cette police (voir le
  README de @vectis/ui) : elle n'est pas embarquée dans le package — et depuis
  le registre d'icônes intégré, elle ne sert plus qu'aux noms d'icônes des
  STORIES (`favorite`, `edit`…), jamais aux icônes rendues par le DS.
  display=block évite le flash du nom d'icône en toutes lettres.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
/>

<!--
  Polices d'icônes TIERCES, uniquement pour les stories « Polices d'icônes »
  d'Icon : elles démontrent `setIconResolver` sur de vraies bibliothèques, pas
  sur des maquettes. Aucune n'est une dépendance du package — ni npm, ni
  runtime : ce sont des feuilles CDN chargées par cette page de preview.

  Les trois sont des polices À CLASSES (glyphe en `::before`), donc servies par
  `classIconResolver`. Leurs sélecteurs de base sont compatibles avec le
  `<span class="v-icon-glyph …">` que rend Icon :
    - Phosphor  : `.ph { font-family }` + `.ph.ph-x:before { content }`
    - FA 6      : `.fa-solid:before { content: var(--fa) }` + `.fa-xmark { --fa }`
    - Bootstrap : `.bi::before { font-family }` + `.bi-x-lg::before { content }`
-->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
/>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
/>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css"
/>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
/>
