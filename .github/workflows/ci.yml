name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the documentation be redeployed without a code change, and gives a way back in
  # when a push produces no run at all — a delayed webhook is enough for that.
  workflow_dispatch:

# A new push on a branch supersedes the run in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs neither a browser nor the Playwright binaries.
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      # The generated artefacts are committed AND regenerated in `prebuild`, so a stale
      # `tokens.css` would never surface: neither `pnpm test` nor `pnpm typecheck`
      # regenerates it. `--check` compares without writing, and names the file.
      - name: Generated tokens are up to date
        run: pnpm --filter @vectis/ui run tokens:check

      - name: Unit tests
        run: pnpm test

      # `build` chains `check-css-split` through `postbuild` — the repo's only check
      # on the artefact rather than the source.
      - name: Build
        run: pnpm build

      # Its own step, not `postbuild`: attw's `--pack` shells out to `npm pack`, which
      # would fire `prepack` → `build` again.
      - name: Package manifest and type resolution
        run: pnpm --filter @vectis/ui run check:package

      - name: Build Storybook
        run: pnpm build-storybook

  # axe reads COMPUTED colours, so contrast has to be checked once per theme.
  # These are the only jobs that need Chromium, hence their own matrix.
  stories:
    name: Play functions + axe (${{ matrix.theme }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @vectis/ui exec playwright install --with-deps chromium

      - name: Story tests
        run: pnpm test:stories
        env:
          VECTIS_THEME: ${{ matrix.theme }}

  # GitHub Pages project site: the documentation at /vectis-ui/, the Storybook build under
  # /vectis-ui/storybook/. ONE artifact and one deployment, so a link from the docs to a
  # story can never point at a Storybook built from a different commit.
  #
  # Requires, once, in the repository settings: Pages → Source → GitHub Actions.
  pages:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, stories]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Not the workflow's group: a deployment must never be cancelled halfway, and two of
    # them must never overlap.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5

      # The docs consume `dist`, exactly as an npm consumer does, so the library is built
      # first. `pnpm build` would do both in topological order; splitting them keeps the
      # failing step legible.
      - name: Build the library
        run: pnpm --filter @vectis/ui build

      # `postbuild` chains `check-prerender`, which asserts that the design system really
      # rendered on the server — a failure there must stop the deployment, not decorate it.
      - name: Build the documentation
        run: pnpm --filter @vectis/docs build

      # Into the SAME directory, AFTER the vitepress build, which empties `dist` first.
      - name: Build Storybook into the artifact
        run: pnpm --filter @vectis/ui exec storybook build -o ../../apps/docs/.vitepress/dist/storybook

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/.vitepress/dist

      - id: deploy
        uses: actions/deploy-pages@v4
