name: Release

# A tag is the ONLY trigger. `workflow_dispatch` is deliberately absent, unlike ci.yml: the
# guard below compares the manifest version against the tag name, and a dispatch has no tag
# to compare against — it would publish whatever `version` happens to say on the branch,
# which is exactly the accident the guard exists to prevent. Re-running a failed release
# means moving the tag and pushing it again.
on:
  push:
    tags: ['v*']

# Never cancelled, the reasoning of ci.yml's `pages` job: interrupting a publish in flight
# can leave a version half-registered, where a superseded BUILD costs nothing.
concurrency:
  group: release
  cancel-in-progress: false

# Every job states what it needs; anything not named here is denied.
permissions: {}

# Actions are pinned to a commit, a tag being movable by whoever controls the action's
# repository. The comment names the release the commit belongs to.
jobs:
  # Everything that runs dependency code: install, lint, tests, build and pack. It holds no
  # publishing right, so a compromised dev dependency has nothing to publish with.
  build:
    name: Build the package
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      node-version: ${{ steps.version.outputs.node-version }}
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads `packageManager` from the root manifest, so CI runs the pnpm version the repo pins.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tag NAMES a version; the manifest DECIDES what is published. Nothing keeps the two
      # in step, so a `v1.0.0` tag pushed while the manifest still says `0.1.0` would publish
      # 0.1.0 under a tag claiming otherwise — and an npm version is immutable, so the mistake
      # cannot be taken back, only superseded. Failing here costs a tag; failing to check
      # costs the version number.
      #
      # The dist-tag is DERIVED from the version, never defaulted: without `--tag`, a
      # `v1.0.0-rc.1` tag would make a prerelease the default install. A version carrying a
      # prerelease identifier therefore goes to `next` and leaves `latest` where it was.
      - name: The tag and the manifest agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./packages/ui/package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match the manifest version $manifest"
            exit 1
          fi
          case "$manifest" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "publishing vectis-ui@$manifest under the dist-tag $dist_tag"
          {
            echo "node-version=$(cat .nvmrc)"
            echo "version=$manifest"
            echo "dist-tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"

      # The artefact gates, in the order ci.yml runs them. Storybook and the axe matrix are
      # deliberately NOT here: they guard rendering and accessibility regressions, which the
      # push to main already exercised, and neither says anything about the tarball.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Chains `postbuild`: the per-component CSS split, then the size gate against the
      # committed baseline.
      - name: Build
        run: pnpm build

      # Its own step, never `postbuild` — attw's `--pack` shells out to `npm pack`, which
      # would fire `prepack` → `build` again, unbounded.
      - name: Package manifest and type resolution
        run: pnpm --filter vectis-ui run check:package

      # pnpm packs, not npm: it resolves the `catalog:` ranges in the manifest. `prepack`
      # rebuilds on the way in, so the tarball is built from the tagged tree.
      - name: Pack
        run: pnpm --filter vectis-ui pack --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Publishes the tarball and nothing else: no checkout, no install, no third-party action.
  # `id-token: write` lets the runner mint the OIDC token npm exchanges for a short-lived
  # publish credential, which is why no NPM_TOKEN is stored here; only this job holds it.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      # npm publishes, at 11.5.1 or later for trusted publishing; the Node of `.nvmrc` ships
      # a later one. Publishing through OIDC also generates the provenance attestation.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # npm refuses a version the registry already holds, so a green step means published.
      # The `./` is required: npm reads `package/<file>.tgz` as a GitHub `owner/repo` spec.
      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: |
          echo "publishing vectis-ui@$VERSION under the dist-tag $DIST_TAG"
          npm publish "./package/vectis-ui-$VERSION.tgz" --tag "$DIST_TAG"

  # A job of its own, after the publish: it needs `contents: write`, which the publish job
  # has no reason to hold, and a GitHub release announcing a version npm refused would be a
  # lie. The notes ARE the CHANGELOG section of that version, never written a second time.
  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A missing CHANGELOG section FAILS the job rather than publishing an empty release:
      # the package is already on npm by then, so the red job is the reminder, and the
      # release can be created by hand once the section exists.
      #
      # An existing release is left alone, so moving a tag and pushing it again to re-run a
      # failed publish does not fail here a second time.
      #
      # A prerelease version is marked as such; for any other, `gh` picks "Latest" itself by
      # semver, so a patch cut on an older line never takes the badge from a newer release.
      - name: Create the release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, nothing to do"
            exit 0
          fi
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease \
            --title "vectis-ui $version" --notes-file notes.md
